# Xcode project definition. Generate the project with XcodeGen:
#   brew install xcodegen && cd app/Rehabit && xcodegen && open Rehabit.xcodeproj
# The generated .xcodeproj is not committed.
name: Rehabit
options:
  bundleIdPrefix: app.rehabit
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  RehabitCore:
    path: ../RehabitCore
targets:
  Rehabit:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: RehabitCore
      - sdk: HealthKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Rehabit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app uses no encryption of its own, which lets TestFlight skip the export question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: >-
          Rehabit reads heart rate variability, resting heart rate, sleep, steps and body weight
          to show them beside your training load. It never writes to Health.
        # Apple requires this key for any app with the HealthKit entitlement, even one that only reads.
        NSHealthUpdateUsageDescription: >-
          Rehabit does not write to Health. It only reads heart rate variability, body weight,
          resting heart rate, sleep and steps to show them beside your training load.
    entitlements:
      path: Rehabit.entitlements
      properties:
        com.apple.developer.healthkit: true
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [RehabitUITests]
  # Drives the workout screen with made-up data and saves screenshots
  # (debug builds launched with -demo-workout use a throwaway database).
  RehabitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Rehabit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
