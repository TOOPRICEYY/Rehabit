[project]
name = "rehabit-service"
version = "0.1.0"
description = "Rehabit service: importers, tissue load ledger, flags and a read-only MCP server"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest"]

[project.scripts]
rehabit = "rehabit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rehabit*"]

[tool.setuptools.package-data]
rehabit = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
